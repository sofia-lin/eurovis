<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2e; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#topbar {
  background: #fff; border-bottom: 1px solid #dde3ed;
  padding: 10px 22px; display: flex; align-items: center; gap: 14px;
  flex-shrink: 0; box-shadow: 0 1px 4px rgba(0,0,0,.06); z-index: 10;

#topbar h1 { font-size: .98rem; font-weight: 700; letter-spacing: -.3px; }
#topbar h1 span { color: #2563eb; }
#year-select {

}
#year-select:focus { outline: none; border-color: #2563eb; }
.topbar-hint { font-size: .73rem; color: #9ca3af; margin-left: auto; }
.legend { display: flex; gap: 8px; }
.lp { display: flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 500; color: #555; background: #f5f7fa; border: 1px solid #e5e9ef; border-radius: 20px; padding: 3px 9px; }
.lp-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

#main { display: flex; flex: 1; overflow: hidden; }
#chart-panel { flex: 1; background: #edf1f7; position: relative; overflow: hidden; }
#chart-panel svg { width: 100%; height: 100%; }

.grid-line  { stroke: #e4e9f2; stroke-width: 1; }
.axis-line  { stroke: #c8d4e4; stroke-width: 1.5; }
.axis-tick  { stroke: #c8d4e4; stroke-width: 1; }
.tick-label { font-size: 9px; fill: #9ca3af; font-family: 'Inter', sans-serif; }
.col-title  { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-family: 'Inter', sans-serif; }

.conn { fill: none; transition: stroke-width .1s, opacity .1s; cursor: pointer; }
.conn.faded { opacity: .07 !important; stroke-width: 1 !important; }
.ctry-label { font-family: 'Inter', sans-serif; fill: #374151; cursor: pointer; }
.ctry-label.faded { fill: #c8d0dc; }
.ctry-label.selected { font-weight: 700; }
.dot { cursor: pointer; }
.dot.faded { opacity: .1 !important; }

#sidebar { width: 300px; background: #fff; border-left: 1px solid #dde3ed; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
#sc { flex: 1; overflow-y: auto; padding: 20px; }
#ph { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; text-align: center; color: #9ca3af; }
#ph p { font-size: .8rem; line-height: 1.55; }
#cd { display: none; }
#cd h2 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.4px; margin-bottom: 10px; }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; font-size: .77rem; color: #555; margin-bottom: 8px; }
.mk { font-weight: 600; color: #1a1a2e; }
.meta a { color: #2563eb; text-decoration: none; }
.meta a:hover { text-decoration: underline; }
.sec { font-size: .67rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9ca3af; margin: 14px 0 8px; padding-bottom: 5px; border-bottom: 1px solid #f0f2f5; }
.score-cmp { display: flex; gap: 8px; margin-bottom: 12px; }
.score-box { flex: 1; border-radius: 8px; padding: 10px 8px; text-align: center; }
.score-val { font-size: 1.4rem; font-weight: 700; line-height: 1; }
.score-lbl { font-size: .64rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #8a96aa; margin-top: 3px; }
.hbar-row { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.hbar-side { width: 46px; font-weight: 600; font-size: .67rem; letter-spacing: .04em; text-transform: uppercase; }
.hbar-side.jury { color: #2563eb; text-align: right; }
.hbar-side.tele { color: #059669; }
.hbar-track { flex: 1; height: 13px; background: #f0f2f5; border-radius: 3px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 3px; }
.hbar-val { font-size: .72rem; font-weight: 700; color: #1a1a2e; width: 36px; }
.rank-row { display: flex; align-items: center; gap: 8px; font-size: .77rem; margin-bottom: 5px; color: #555; }
.rank-row strong { color: #1a1a2e; }
.div-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; margin-bottom: 12px; }
.bias-bar-wrap { margin: 10px 0; }
.bias-bar-track { height: 12px; background: #f0f2f5; border-radius: 3px; position: relative; overflow: hidden; }
.bias-bar-fill { height: 100%; position: absolute; border-radius: 3px; }
.bias-zero { position: absolute; top: 0; bottom: 0; width: 1.5px; background: #9ca3af; }
</style>

let W, H, xJ, xM, xT, yScale, axesG, dynG;

function setupDims() {
  W = svgEl.clientWidth; H = svgEl.clientHeight;
  const iW = W - MARGIN.left - MARGIN.right;
  const iH = H - MARGIN.top - MARGIN.bottom;
  xJ = MARGIN.left; xM = MARGIN.left + iW / 2; xT = MARGIN.left + iW;
  // Same scale for both axes — jury & tele are both in points
  yScale = d3.scaleLinear().domain([0, MAX_PTS]).range([MARGIN.top + iH, MARGIN.top]);
}

function drawAxes() {
  if (axesG) axesG.remove();
  axesG = svg.append('g');
  const iH = H - MARGIN.top - MARGIN.bottom;
  const ticks = [0, 50, 100, 150, 200, 250, 300, 350, 400, 450];

  ticks.forEach(v => {
    const y = yScale(v);
    axesG.append('line').attr('class','grid-line').attr('x1',xJ).attr('x2',xT).attr('y1',y).attr('y2',y);
  });

  [xJ, xT].forEach(x => axesG.append('line').attr('class','axis-line')
    .attr('x1',x).attr('x2',x).attr('y1',MARGIN.top).attr('y2',MARGIN.top+iH));

  ticks.forEach(v => {
    const y = yScale(v);
    axesG.append('line').attr('class','axis-tick').attr('x1',xJ-4).attr('x2',xJ+4).attr('y1',y).attr('y2',y);
    axesG.append('text').attr('class','tick-label').attr('x',xJ-8).attr('y',y+3.5).attr('text-anchor','end').text(v);
    axesG.append('line').attr('class','axis-tick').attr('x1',xT-4).attr('x2',xT+4).attr('y1',y).attr('y2',y);
    axesG.append('text').attr('class','tick-label').attr('x',xT+8).attr('y',y+3.5).attr('text-anchor','start').text(v);
  });

  const headers = [
    [xJ, 'JURY POINTS',   '#2563eb', false],
    [xM, 'COUNTRIES',     '#6b7280', true ],
    [xT, 'PUBLIC POINTS', '#059669', false]
  ];
  headers.forEach(([x, label, fill, italic]) => {
    axesG.append('text').attr('class','col-title').attr('fill',fill)
      .attr('x',x).attr('y',MARGIN.top-30).attr('text-anchor','middle')
      .attr('font-style', italic?'italic':'normal').text(label);
  });

  axesG.append('text').attr('fill','#9ca3af').attr('font-size',8).attr('font-family','Inter,sans-serif')
    .attr('x',xJ-8).attr('y',MARGIN.top-14).attr('text-anchor','end').text('← higher');
  axesG.append('text').attr('fill','#9ca3af').attr('font-size',8).attr('font-family','Inter,sans-serif')
    .attr('x',xT+8).attr('y',MARGIN.top-14).attr('text-anchor','start').text('higher →');
}

const curve = d3.line().curve(d3.curveBasis);

function render() {
  if (dynG) dynG.remove();
  dynG = svg.append('g');

  const rows = ALL[year];
  const n = rows.length;
  const iH = H - MARGIN.top - MARGIN.bottom;

  const sorted = [...rows].sort((a, b) => (a.place || 99) - (b.place || 99))
  const midY = new Map(sorted.map((d,i) => [d.country, MARGIN.top + i * iH / (n-1)]));

  rows.forEach(d => {
    const jy = yScale(d.jury);
    const ty = yScale(d.tele);
    const my = midY.get(d.country);
    const c  = col(d);
    const diff = Math.abs(d.bias);
    const isExtreme = diff > 100;
    const sw = isExtreme ? 2 : 1.2;
    const op = isExtreme ? 0.72 : 0.38;

    const ptsL = [[xJ,jy],[xJ+(xM-xJ)*.38,jy],[xJ+(xM-xJ)*.62,my],[xM,my]];
    const ptsR = [[xM,my],[xM+(xT-xM)*.38,my],[xM+(xT-xM)*.62,ty],[xT,ty]];

    const pathL = dynG.append('path').datum(ptsL).attr('d',curve)
      .attr('class','conn').attr('stroke',c).attr('stroke-width',sw).attr('opacity',op).attr('data-c',d.country);
    const pathR = dynG.append('path').datum(ptsR).attr('d',curve)
      .attr('class','conn').attr('stroke',c).attr('stroke-width',sw).attr('opacity',op).attr('data-c',d.country);

    [ptsL,ptsR].forEach(pts => {
      dynG.append('path').datum(pts).attr('d',curve)
        .attr('fill','none').attr('stroke','transparent').attr('stroke-width',14)
        .style('cursor','pointer').attr('data-c',d.country)
        .on('mouseenter', () => { if(selected!==d.country) activate(d,pathL,pathR,dJ,dT,dM,lbl,sw,op); })
        .on('mouseleave', () => { if(selected!==d.country) deactivate(d,pathL,pathR,dJ,dT,dM,lbl,sw,op); })
        .on('click', () => onSelect(d,pathL,pathR,dJ,dT,dM,lbl,sw,op));
    });

    const dJ = dynG.append('circle').attr('class','dot').attr('cx',xJ).attr('cy',jy).attr('r',3.5).attr('fill','#2563eb').attr('opacity',.55).attr('data-c',d.country);
    const dT = dynG.append('circle').attr('class','dot').attr('cx',xT).attr('cy',ty).attr('r',3.5).attr('fill','#059669').attr('opacity',.55).attr('data-c',d.country);
    const dM = dynG.append('circle').attr('class','dot').attr('cx',xM).attr('cy',my).attr('r',4).attr('fill',c).attr('opacity',.7).attr('data-c',d.country);

    const lbl = dynG.append('text').attr('class','ctry-label')
      .attr('x',xM+8).attr('y',my+3.5).attr('text-anchor','start')
      .attr('font-size',n>25?9:10).attr('data-c',d.country).text(d.country);

    [dJ,dT,dM,lbl].forEach(el => {
      el.on('mouseenter', () => { if(selected!==d.country) activate(d,pathL,pathR,dJ,dT,dM,lbl,sw,op); })
        .on('mouseleave', () => { if(selected!==d.country) deactivate(d,pathL,pathR,dJ,dT,dM,lbl,sw,op); })
        .on('click', () => onSelect(d,pathL,pathR,dJ,dT,dM,lbl,sw,op));
    });
  });
}

function activate(d,pL,pR,dJ,dT,dM,lbl,sw,op) {
  dynG.selectAll('.conn,.ctry-label,.dot').classed('faded', function() { return this.dataset.c !== d.country; });
  [pL,pR].forEach(p => p.attr('stroke-width',3).attr('opacity',1));
  [dJ,dT].forEach(dot => dot.attr('r',5).attr('opacity',1));
  dM.attr('r',5.5).attr('opacity',1);
  lbl.attr('font-weight',700).classed('selected',true).classed('faded',false);
}

function deactivate(d,pL,pR,dJ,dT,dM,lbl,sw,op) {
  dynG.selectAll('.conn,.ctry-label,.dot').classed('faded',false);
  [pL,pR].forEach(p => p.attr('stroke-width',sw).attr('opacity',op));
  dJ.attr('r',3.5).attr('opacity',.55); dT.attr('r',3.5).attr('opacity',.55);
  dM.attr('r',4).attr('opacity',.7);
  lbl.attr('font-weight',null).classed('selected',false);
}

function onSelect(d,pL,pR,dJ,dT,dM,lbl,sw,op) {
  if (selected===d.country) { selected=null; deactivate(d,pL,pR,dJ,dT,dM,lbl,sw,op); showPH(); }
  else {
    dynG.selectAll('.conn,.ctry-label,.dot').classed('faded',false).classed('selected',false).attr('font-weight',null);
    selected=d.country; activate(d,pL,pR,dJ,dT,dM,lbl,sw,op); showDetail(d);
  }
}

function showPH() {
  document.getElementById('ph').style.display='flex';
  document.getElementById('cd').style.display='none';
}

function showDetail(d) {
  document.getElementById('ph').style.display='none';
  const cd = document.getElementById('cd');
  cd.style.display='block';

  const rows = ALL[year];
  const n = rows.length;
  const juryRank = [...rows].sort((a,b)=>b.jury-a.jury).findIndex(x=>x.country===d.country)+1;
  const teleRank = [...rows].sort((a,b)=>b.tele-a.tele).findIndex(x=>x.country===d.country)+1;
  const c = col(d);

  const juryBarW = (d.jury/MAX_PTS*100).toFixed(1);
  const teleBarW = (d.tele/MAX_PTS*100).toFixed(1);

  // Bias bar: centred, bias = jury - tele, range roughly -460 to +460
  const maxBias = 460;
  const biasBarW = (Math.abs(d.bias)/maxBias*50).toFixed(1);
  const biasLeft = d.bias >= 0 ? '50%' : (50 - parseFloat(biasBarW))+'%';
  const biasCol  = d.bias > 0 ? '#2563eb' : '#059669';

  const catVal = cat(d);
  let divMsg='', divBg='', divFg='';
  if (catVal==='agree') { divMsg='≈ Jury & public agreed';       divBg='#fefce8'; divFg='#854d0e'; }
  else if (catVal==='jury') { divMsg=`↑ Jury gave ${Math.abs(d.bias)} pts more`; divBg='#eff6ff'; divFg='#1d4ed8'; }
  else { divMsg=`↑ Public gave ${Math.abs(d.bias)} pts more`;   divBg='#f0fdf4'; divFg='#166534'; }

  cd.innerHTML = `
    <h2>${d.country}</h2>
    <div class="meta">
      <span class="mk">Year:</span><span>${year}</span>
      ${d.place ? `<span class="mk">Final place:</span><span>#${d.place} of ${n}</span>` : ''}
      ${d.performer ? `<span class="mk">Performer:</span><span>${d.performer}</span>` : ''}
      ${d.song ? `<span class="mk">Song:</span><span>${d.song}</span>` : ''}
      ${d.yt ? `<span class="mk">YouTube:</span><span><a href="${d.yt}" target="_blank">Watch ↗</a></span>` : ''}
    </div>

    <div class="div-badge" style="background:${divBg};color:${divFg}">${divMsg}</div>

    <div class="sec">Score Comparison</div>
    <div class="score-cmp">
      <div class="score-box" style="background:#eff6ff;border:1px solid #dbeafe">
        <div class="score-val" style="color:#2563eb">${d.jury}</div>
        <div class="score-lbl">Jury pts</div>
      </div>
      <div class="score-box" style="background:#f0fdf4;border:1px solid #bbf7d0">
        <div class="score-val" style="color:#059669">${d.tele}</div>
        <div class="score-lbl">Public pts</div>
      </div>
    </div>

    <div class="hbar-row">
      <span class="hbar-side jury">Jury</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${juryBarW}%;background:#2563eb;opacity:.8"></div></div>
      <span class="hbar-val">${d.jury}</span>
    </div>
    <div class="hbar-row">
      <span class="hbar-side tele">Public</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${teleBarW}%;background:#059669;opacity:.8"></div></div>
      <span class="hbar-val">${d.tele}</span>
    </div>

    <div class="sec">Bias (jury − public)</div>
    <div style="font-size:.72rem;color:#6b7280;margin-bottom:6px">
      ${d.bias > 0 ? `Jury gave <strong style="color:#2563eb">+${d.bias}</strong> more points` :
        d.bias < 0 ? `Public gave <strong style="color:#059669">+${Math.abs(d.bias)}</strong> more points` :
        'Jury and public were exactly equal'}
    </div>
    <div class="bias-bar-wrap">
      <div class="bias-bar-track">
        <div class="bias-zero" style="left:50%"></div>
        <div class="bias-bar-fill" style="width:${biasBarW}%;left:${biasLeft};background:${biasCol};opacity:.75"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:8px;color:#9ca3af;margin-top:3px">
        <span>← Public favoured</span><span>Jury favoured →</span>
      </div>
    </div>

    <div class="sec">Rankings</div>
    <div class="rank-row"><span style="color:#2563eb;font-weight:600">Jury rank</span> → <strong>#${juryRank}</strong> of ${n}</div>
    <div class="rank-row"><span style="color:#059669;font-weight:600">Public rank</span> → <strong>#${teleRank}</strong> of ${n}</div>
    ${juryRank!==teleRank ? `<div class="rank-row" style="font-size:.72rem;color:#6b7280">
      Δ ${Math.abs(juryRank-teleRank)} places apart
      (${juryRank<teleRank?'jury ranked higher':'public ranked higher'})
    </div>` : ''}

    <div class="sec">Total</div>
    <div class="rank-row"><span style="font-weight:600">Combined score</span> → <strong>${d.total}</strong> pts</div>
  `;
}

function init() { setupDims(); drawAxes(); render(); }
window.addEventListener('resize', () => { setupDims(); drawAxes(); render(); });
init();
</script>
</body>
</html>
